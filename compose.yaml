services:
  ui:
    image: jbscosoft/binops-sys:${UI_IMAGE_TAG:-ui-latest}
    container_name: binops-sys-ui
    pull_policy: always
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://binops-sys-api:8001}
    ports:
      - "${UI_BIND_ADDRESS:-127.0.0.1}:${UI_PORT:-8080}:80"
    networks:
      - binops_backend
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/healthz
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  binops_backend:
    name: binops_backend
    external: true

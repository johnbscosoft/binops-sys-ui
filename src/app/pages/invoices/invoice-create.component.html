<app-breadcrumbs title="Create Invoice" [breadcrumbItems]="[{ label: 'Finance', active: true }, { label: 'Invoices', active: true }, { label: 'Create Invoice', active: true }]"></app-breadcrumbs>

<form (ngSubmit)="save()"><fieldset [disabled]="saving"><div class="row"><div class="col-xl-8"><div class="card"><div class="card-header"><h5 class="card-title mb-0">Invoice Details</h5></div><div class="card-body"><div class="row g-3"><div class="col-md-6"><label class="form-label">Customer <span class="text-danger">*</span></label><select class="form-select" [(ngModel)]="customerId" name="customer" [disabled]="loadingCustomers"><option [ngValue]="null">{{ loadingCustomers ? 'Loading customers…' : 'Select customer' }}</option>@for (customer of customers; track customer.id) { <option [ngValue]="customer.id">{{ customer.name }} — CUST-{{ customer.id | number:'4.0-0' }}</option> }</select></div><div class="col-md-3"><label class="form-label">Issue Date <span class="text-danger">*</span></label><input type="date" class="form-control" [(ngModel)]="issueDate" name="issueDate"></div><div class="col-md-3"><label class="form-label">Due Date <span class="text-danger">*</span></label><input type="date" class="form-control" [(ngModel)]="dueDate" name="dueDate"></div><div class="col-md-6"><label class="form-label">Status <span class="text-danger">*</span></label><select class="form-select" [(ngModel)]="status" name="status"><option>Draft</option><option>Issued</option></select></div><div class="col-md-6"><label class="form-label">Invoice Number</label><input class="form-control" value="Generated by the API on save" disabled></div></div></div></div>
<div class="card"><div class="card-header d-flex justify-content-between align-items-center"><h5 class="card-title mb-0">Invoice Items</h5><button type="button" class="btn btn-sm btn-soft-success" (click)="addLine()"><i class="ri-add-line me-1"></i>Add Item</button></div><div class="card-body"><div class="table-responsive"><table class="table align-middle"><thead class="table-light"><tr><th>Description <span class="text-danger">*</span></th><th style="width: 120px">Qty <span class="text-danger">*</span></th><th style="width: 180px">Unit Price (UGX) <span class="text-danger">*</span></th><th class="text-end" style="width: 150px">Amount</th><th style="width: 54px"></th></tr></thead><tbody>@for (line of lines; track $index; let index = $index) { <tr><td><input class="form-control" [(ngModel)]="line.description" [name]="'description' + index" placeholder="Service description"></td><td><input type="number" min="1" class="form-control" [(ngModel)]="line.quantity" [name]="'quantity' + index"></td><td><input type="number" min="0" class="form-control" [(ngModel)]="line.unitPrice" [name]="'unitPrice' + index"></td><td class="text-end fw-medium">UGX {{ (line.quantity * line.unitPrice) | number }}</td><td><button type="button" class="btn btn-sm btn-soft-danger btn-icon" [disabled]="lines.length === 1" (click)="removeLine(index)" aria-label="Remove item"><i class="ri-delete-bin-line"></i></button></td></tr> }</tbody></table></div></div></div>
</div><div class="col-xl-4"><div class="card"><div class="card-header"><h5 class="card-title mb-0">Summary</h5></div><div class="card-body"><div class="d-flex justify-content-between mb-3"><span class="text-muted">Invoice Total</span><h4 class="mb-0">{{ currency }} {{ total | number }}</h4></div><label class="form-label">Notes</label><textarea class="form-control" rows="5" [(ngModel)]="notes" name="notes" placeholder="Optional note for the customer"></textarea></div></div></div></div></fieldset><div class="d-flex justify-content-end gap-2"><button type="button" class="btn btn-light" [disabled]="saving" (click)="cancel()">Cancel</button><button type="submit" class="btn btn-success" [disabled]="saving">@if (saving) { <span class="spinner-border spinner-border-sm me-1"></span>Saving… } @else { <i class="ri-save-line me-1"></i>Create Invoice }</button></div></form>

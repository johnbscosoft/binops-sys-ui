<app-breadcrumbs title="Designations" [breadcrumbItems]="[{label:'Administration'},{label:'Designations',active:true}]"></app-breadcrumbs><div class="card"><div class="card-header"><h5 class="mb-0">Staff Designations</h5></div><div class="card-body"><div class="row g-2 mb-4"><div class="col-md-6"><input class="form-control" [(ngModel)]="name" placeholder="Designation name"></div><div class="col-md-3"><select class="form-select" [(ngModel)]="is_active"><option [ngValue]="true">Active</option><option [ngValue]="false">Inactive</option></select></div><div class="col-md-3"><button class="btn btn-success w-100" (click)="save()">{{editing?'Update':'Add Designation'}}</button></div></div><table class="table align-middle"><thead><tr><th>Designation</th><th>Status</th><th>Created</th><th class="text-end">Actions</th></tr></thead><tbody>@for(item of items;track item.id){<tr><td>{{item.name}}</td><td>{{item.is_active?'Active':'Inactive'}}</td><td>{{item.created_at|date:'mediumDate'}}</td><td class="text-end"><button class="btn btn-sm btn-soft-primary me-2" (click)="edit(item)">Edit</button><button class="btn btn-sm btn-soft-danger" (click)="remove(item)">Delete</button></td></tr>}@empty{<tr><td colspan="4" class="text-center text-muted">No designations found.</td></tr>}</tbody></table></div></div>

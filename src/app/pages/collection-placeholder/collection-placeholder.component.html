<app-breadcrumbs [title]="content.title" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>
<div class="d-flex justify-content-between align-items-center mb-4"><div><h4 class="mb-1">{{ content.title }}</h4><p class="text-muted mb-0">{{ content.description }}</p></div><button class="btn btn-success"><i class="ri-add-line me-1"></i>New action</button></div>
<div class="row g-3 mb-4">@for (metric of content.metrics; track metric.label) { <div class="col-md-3"><div class="card mb-0"><div class="card-body"><p class="text-muted mb-1">{{ metric.label }}</p><h3 class="mb-0" [class]="'text-' + metric.variant">{{ metric.value }}</h3></div></div></div> }</div>
<div class="card"><div class="card-header"><h5 class="card-title mb-0">Sample data</h5></div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>Item</th><th>Details</th><th>Status</th></tr></thead><tbody>@for (row of content.rows; track row.primary) { <tr><td class="fw-medium">{{ row.primary }}</td><td class="text-muted">{{ row.secondary }}</td><td><span class="badge" [class]="'bg-' + row.variant + '-subtle text-' + row.variant">{{ row.status }}</span></td></tr> }</tbody></table></div></div></div>

name: UI CI and Docker Image

on:
  pull_request:
    branches:
      - main
      - master
      - testenv
  push:
    branches:
      - main
      - master
      - testenv
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ui-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: jbscosoft/binops-sys

jobs:
  test:
    name: Test and build UI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        continue-on-error: true
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build production application
        run: npm run build -- --configuration production

  docker:
    name: Build and push UI image
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: jbscosoft
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=ui-sha-${{ github.sha }}
            type=ref,event=branch,prefix=ui-
            type=semver,pattern={{version}},prefix=ui-
            type=semver,pattern={{major}}.{{minor}},prefix=ui-
            type=raw,value=ui-latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
